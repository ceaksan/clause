<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480" role="img" aria-label="Clause board with two herdr workspaces, open and decided decisions">
  <defs>
    <style>
      text { font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <clipPath id="panel-clip">
      <rect width="320" height="480" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#panel-clip)">
    <rect width="320" height="480" fill="rgb(19,19,19)"/>

    <!-- Title bar -->
    <rect width="320" height="52" fill="rgb(13,13,13)"/>
    <circle cx="16" cy="13" r="5" fill="rgb(255,95,87)"/>
    <circle cx="32" cy="13" r="5" fill="rgb(255,189,46)"/>
    <circle cx="48" cy="13" r="5" fill="rgb(39,201,63)"/>
    <text x="14" y="40" fill="rgb(191,191,191)" font-size="11" font-weight="600">Clause</text>
    <rect x="246" y="29" width="46" height="16" rx="8" fill="rgba(245,190,60,0.16)"/>
    <text x="269" y="40.5" fill="rgb(245,190,60)" font-size="9" font-weight="600" text-anchor="middle">2 open</text>
    <path d="M301 31 h6 l-1 4 2 2 h-4 v5 l-0.5 1 -0.5 -1 v-5 h-4 l2 -2 z" fill="rgb(212,212,212)"/>
    <rect y="52" width="320" height="1" fill="rgb(43,43,43)"/>

    <!-- Workspace: api-migration -->
    <text x="14" y="76" fill="rgb(242,242,242)" font-size="11" font-weight="700">api-migration</text>
    <text x="96" y="76" class="mono" fill="rgb(102,102,102)" font-size="8">w3</text>
    <rect x="252" y="65" width="40" height="15" rx="7.5" fill="rgba(245,190,60,0.16)"/>
    <text x="272" y="75.5" fill="rgb(245,190,60)" font-size="8.5" font-weight="600" text-anchor="middle">1 open</text>
    <path d="M300 68 h8 M302 68 v-1.5 h4 v1.5 M301 69 l0.8 8 h4.4 l0.8 -8" stroke="rgb(97,97,97)" stroke-width="1" fill="none"/>

    <rect x="17" y="88" width="1" height="214" fill="rgb(51,51,51)"/>
    <rect x="26" y="88" width="9" height="7" rx="1.5" stroke="rgb(140,140,140)" stroke-width="0.9" fill="none"/>
    <text x="40" y="95" fill="rgb(166,166,166)" font-size="9.5" font-weight="600">reviewer</text>
    <text x="84" y="95" class="mono" fill="rgb(97,97,97)" font-size="8">p2</text>

    <!-- Open decision with memo -->
    <rect x="24" y="103" width="284" height="96" rx="6" fill="rgba(245,190,60,0.07)" stroke="rgba(245,190,60,0.35)" stroke-width="1"/>
    <circle cx="37" cy="116" r="4.5" stroke="rgb(245,190,60)" stroke-width="1.3" stroke-dasharray="1.6 1.6" fill="none"/>
    <text x="50" y="119" fill="rgb(230,230,230)" font-size="10.5" font-weight="500">Pick the migration strategy: dual-write</text>
    <text x="50" y="134" fill="rgb(230,230,230)" font-size="10.5" font-weight="500">or backfill first? Asked the db agent.</text>
    <text x="50" y="151" class="mono" fill="rgb(140,140,140)" font-size="8">D-12</text>
    <rect x="73" y="144" width="5" height="6" rx="1" stroke="rgb(140,140,140)" stroke-width="0.8" fill="none"/>
    <rect x="75" y="146" width="5" height="6" rx="1" stroke="rgb(140,140,140)" stroke-width="0.8" fill="rgb(30,27,20)"/>
    <text x="86" y="151" class="mono" fill="rgb(115,115,115)" font-size="8">14:02</text>
    <rect x="50" y="160" width="248" height="30" rx="4" fill="rgb(38,38,38)"/>
    <rect x="50" y="160" width="2" height="30" fill="rgb(245,190,60)"/>
    <text x="58" y="172" fill="rgb(184,184,184)" font-size="9.5">Backfill locks orders for ~4 min.</text>
    <text x="58" y="184" fill="rgb(184,184,184)" font-size="9.5">Ask about the read replica first.</text>

    <!-- Warning -->
    <rect x="24" y="205" width="284" height="44" rx="6" fill="rgb(26,26,26)"/>
    <path d="M37 210 l5 9 h-10 z" fill="rgb(239,96,80)"/>
    <text x="50" y="219" fill="rgb(230,230,230)" font-size="10.5">Staging DB is on the old schema</text>
    <text x="50" y="238" class="mono" fill="rgb(140,140,140)" font-size="8">W-11</text>
    <text x="78" y="238" class="mono" fill="rgb(115,115,115)" font-size="8">13:48</text>

    <!-- Decided -->
    <rect x="24" y="255" width="284" height="44" rx="6" fill="rgb(24,24,24)"/>
    <circle cx="37" cy="267" r="5" fill="rgb(74,170,110)"/>
    <path d="M34.6 267 l1.6 1.7 3.2 -3.4" stroke="rgb(19,19,19)" stroke-width="1.3" fill="none"/>
    <text x="50" y="270" fill="rgb(128,128,128)" font-size="10.5">Keep UUID primary keys</text>
    <text x="50" y="289" class="mono" fill="rgb(115,115,115)" font-size="8">D-9</text>
    <text x="70" y="289" class="mono" fill="rgb(115,115,115)" font-size="8">13:20</text>
    <text x="104" y="289" class="mono" fill="rgba(74,170,110,0.7)" font-size="8">decided 13:41</text>

    <!-- Workspace: audit -->
    <text x="14" y="330" fill="rgb(242,242,242)" font-size="11" font-weight="700">audit</text>
    <text x="48" y="330" class="mono" fill="rgb(102,102,102)" font-size="8">w5</text>
    <rect x="252" y="319" width="40" height="15" rx="7.5" fill="rgba(245,190,60,0.16)"/>
    <text x="272" y="329.5" fill="rgb(245,190,60)" font-size="8.5" font-weight="600" text-anchor="middle">1 open</text>
    <path d="M300 322 h8 M302 322 v-1.5 h4 v1.5 M301 323 l0.8 8 h4.4 l0.8 -8" stroke="rgb(97,97,97)" stroke-width="1" fill="none"/>

    <rect x="17" y="342" width="1" height="80" fill="rgb(51,51,51)"/>
    <rect x="26" y="342" width="9" height="7" rx="1.5" stroke="rgb(140,140,140)" stroke-width="0.9" fill="none"/>
    <text x="40" y="349" fill="rgb(166,166,166)" font-size="9.5" font-weight="600">scanner</text>
    <text x="80" y="349" class="mono" fill="rgb(97,97,97)" font-size="8">p1</text>

    <rect x="24" y="357" width="284" height="44" rx="6" fill="rgba(245,190,60,0.07)" stroke="rgba(245,190,60,0.35)" stroke-width="1"/>
    <circle cx="37" cy="370" r="4.5" stroke="rgb(245,190,60)" stroke-width="1.3" stroke-dasharray="1.6 1.6" fill="none"/>
    <text x="50" y="373" fill="rgb(230,230,230)" font-size="10.5" font-weight="500">Treat consent banners as blocking?</text>
    <text x="50" y="392" class="mono" fill="rgb(140,140,140)" font-size="8">D-14</text>
    <text x="78" y="392" class="mono" fill="rgb(115,115,115)" font-size="8">14:10</text>

    <rect x="24" y="407" width="284" height="22" rx="6" fill="rgb(26,26,26)"/>
    <rect x="33" y="413" width="9" height="9" rx="2" stroke="rgb(160,160,160)" stroke-width="1" fill="none"/>
    <text x="50" y="421" fill="rgb(230,230,230)" font-size="10.5">Re-run the 10 Ticimax sites</text>

    <!-- Input bar -->
    <rect y="440" width="320" height="1" fill="rgb(43,43,43)"/>
    <rect x="10" y="448" width="214" height="24" rx="6" fill="rgb(28,28,28)" stroke="rgb(46,46,46)" stroke-width="1"/>
    <text x="20" y="464" fill="rgb(115,115,115)" font-size="10">Add a note...</text>
    <rect x="232" y="450" width="22" height="20" rx="4" fill="rgb(56,56,56)"/>
    <text x="243" y="464" fill="rgb(235,235,235)" font-size="9" font-weight="600" text-anchor="middle">N</text>
    <rect x="258" y="450" width="22" height="20" rx="4" fill="rgb(36,36,36)"/>
    <text x="269" y="464" fill="rgb(140,140,140)" font-size="9" text-anchor="middle">T</text>
    <rect x="284" y="450" width="22" height="20" rx="4" fill="rgb(36,36,36)"/>
    <text x="295" y="464" fill="rgb(140,140,140)" font-size="9" text-anchor="middle">W</text>
  </g>
</svg>
